sonar.projectKey=sirosfoundation_siros-sdk-kotlin
sonar.organization=sirosfoundation

sonar.sources=sdk
sonar.tests=sdk
sonar.test.inclusions=**/test/**,**/androidTest/**

# Exclude test sources and build artifacts from main analysis
sonar.exclusions=**/test/**,**/androidTest/**,**/build/**

# Vendored UniFFI-generated bindings (siros-wscd-manager, zk-cred-longfellow):
# both are produced by the same uniffi-bindgen tool and share large amounts
# of structurally-identical boilerplate (FfiConverter implementations,
# RustBuffer handling, error types, ...) that trips the duplication gate
# once a second such file exists - not something to hand-edit, since the
# "duplication" is between two auto-generated files, not our own code.
sonar.cpd.exclusions=**/uniffi/**

# No coverage tooling configured yet — exclude from coverage gate
sonar.coverage.exclusions=**/*
