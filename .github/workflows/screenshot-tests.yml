name: Screenshot Tests

on:
  pull_request:
    paths:
      - 'sample-app/src/main/kotlin/**'
  workflow_dispatch:
    inputs:
      update_snapshots:
        description: 'Update golden snapshots'
        type: boolean
        default: false

# Placeholder workflow — enable when Paparazzi is added to build.gradle.kts:
#   plugins { id("app.cash.paparazzi") version "1.3.5" }
#
# Screenshot test example:
#   @Test fun loginScreen_light() {
#     paparazzi.snapshot { LoginScreen(...) }
#   }
#   @Test fun loginScreen_dark() {
#     paparazzi.snapshot { SirosTheme(darkTheme = true) { LoginScreen(...) } }
#   }
#
# To set up:
# 1. Add Paparazzi plugin to sample-app/build.gradle.kts
# 2. Create sample-app/src/test/kotlin/.../screenshots/ test class
# 3. Run ./gradlew sample-app:recordPaparazziDebug to generate goldens
# 4. Commit goldens to sample-app/src/test/snapshots/
# 5. Enable this workflow

jobs:
  screenshot-test:
    if: false  # Enable when Paparazzi is configured
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Run screenshot tests
        run: ./gradlew sample-app:verifyPaparazziDebug
      - name: Upload diffs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: screenshot-diffs
          path: sample-app/build/reports/paparazzi/
