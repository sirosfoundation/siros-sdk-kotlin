name: nymauth-native

on:
  workflow_call:

permissions:
  contents: read

env:
  RUST_VERSION: 1.98.0
  CARGO_NDK_VERSION: 4.1.2
  NDK_VERSION: 27.3.13750724

jobs:
  build:
    name: Build nymauth-native AAR
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Rust Android targets
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: aarch64-linux-android,x86_64-linux-android

      - name: Set up the Android NDK
        uses: android-actions/setup-android@v4
        with:
          packages: ndk;${{ env.NDK_VERSION }}

      - name: Configure the Android NDK
        run: echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked --version "$CARGO_NDK_VERSION"

      - name: Build nymauth-native AAR and POM
        run: native/nymauth-native/scripts/build-android.sh

      - name: Stage the Maven repository
        run: |
          mkdir -p build/native-repo/org/siros
          cp -R "$HOME/.m2/repository/org/siros/nymauth-native" build/native-repo/org/siros/

      - name: Upload nymauth-native Maven repository
        uses: actions/upload-artifact@v4
        with:
          name: nymauth-native-maven
          path: build/native-repo/
          if-no-files-found: error
          retention-days: 1
