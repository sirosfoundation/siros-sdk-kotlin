name: Code Quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 0 * * 1'

permissions:
  contents: read
  packages: read
  security-events: write

env:
  ORG_GRADLE_PROJECT_sirosNativeRepo: ${{ github.workspace }}/build/native-repo

jobs:
  nymauth-native:
    name: Build nymauth-native AAR
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Rust Android targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android

      - name: Set up the Android NDK
        uses: android-actions/setup-android@v4
        with:
          packages: ndk;27.3.13750724

      - name: Configure the Android NDK
        run: echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.3.13750724" >> "$GITHUB_ENV"

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Build nymauth-native AAR and POM
        run: native/nymauth-native/scripts/build-android.sh

      - name: Stage the Maven repository
        run: |
          mkdir -p build/native-repo/org/siros
          cp -R "$HOME/.m2/repository/org/siros/nymauth-native" build/native-repo/org/siros/

      - name: Upload nymauth-native Maven repository
        uses: actions/upload-artifact@v4
        with:
          name: nymauth-native-maven
          path: build/native-repo/
          if-no-files-found: error
          retention-days: 1

  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    needs: nymauth-native
    strategy:
      fail-fast: false
      matrix:
        language: [java-kotlin, actions]
    steps:
      - uses: actions/checkout@v6

      - name: Download nymauth-native Maven repository
        if: matrix.language == 'java-kotlin'
        uses: actions/download-artifact@v4
        with:
          name: nymauth-native-maven
          path: build/native-repo

      - name: Set up JDK 17
        if: matrix.language == 'java-kotlin'
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        if: matrix.language == 'java-kotlin'
        uses: gradle/actions/setup-gradle@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          # Without this, CodeQL's own internal autobuild still runs for
          # java-kotlin during the analyze step below, ON TOP OF the
          # explicit "Build (Gradle)" step - and that internal autobuild
          # invocation doesn't get this job's GITHUB_TOKEN env var, so it
          # 401s resolving the private org.siros:siros-wscd-manager package
          # from GitHub Packages. build-mode: manual tells CodeQL to trust
          # the explicit build step below instead of re-building itself.
          build-mode: ${{ matrix.language == 'java-kotlin' && 'manual' || 'none' }}

      - name: Build (Gradle)
        if: matrix.language == 'java-kotlin'
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew assemble --no-daemon

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: '/language:${{ matrix.language }}'
