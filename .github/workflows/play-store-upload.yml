name: Upload to Play Store

on:
  # Triggered by the tag push itself, NOT by `release: published`. A release
  # created by a workflow using GITHUB_TOKEN does not trigger further workflow
  # runs, so the `release` trigger silently never fired for v0.6.0 or v0.8.0 —
  # it only worked for v0.7.0, whose release happened to be published under a
  # personal token. Keying off the tag makes the upload independent of who (or
  # what) publishes the GitHub release.
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  ORG_GRADLE_PROJECT_sirosNativeRepo: ${{ github.workspace }}/build/native-repo

jobs:
  nymauth-native:
    uses: ./.github/workflows/nymauth-native.yml

  upload:
    name: Build signed AAB & upload to Play Store internal track
    runs-on: ubuntu-latest
    # packages: read — the bundle build resolves the native AARs from
    # GH Packages (per-repo scoped, read needs auth); without this the
    # GITHUB_TOKEN the build env now passes cannot authenticate
    # (the v0.23.2 upload failure, 2026-11-16).
    permissions:
      contents: read
      packages: read
    needs: nymauth-native
    steps:
      - uses: actions/checkout@v4

      - name: Download nymauth-native Maven repository
        uses: actions/download-artifact@v4
        with:
          name: nymauth-native-maven
          path: build/native-repo

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Configure vendor Maven repository
        run: |
          echo "facetecMavenUrl=${{ secrets.FACETEC_MAVEN_URL }}" >> gradle.properties
          echo "facetecMavenToken=${{ secrets.VENDOR_PACKAGES_TOKEN }}" >> gradle.properties

      - name: Decode upload keystore
        run: echo "${{ secrets.UPLOAD_KEYSTORE_BASE64 }}" | base64 -d > upload.jks

      - name: Build signed release AAB
        # GITHUB_TOKEN into the env: settings.gradle.kts reads
        # GITHUB_ACTOR/GITHUB_TOKEN for the GH Packages Maven credentials
        # (the native AARs — siros-wallet-core, siros-dc-matcher,
        # zk-cred-*, wscd-manager — all live in GH Packages, scoped
        # per-repo, read needs auth). Without it every GH Packages entry
        # answers 401 and the wallet-core pin cannot resolve (the
        # v0.23.2 upload failure, 2026-11-16).
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ./gradlew :sample-app:bundleRelease -x test -x lint \
            -Pandroid.injected.signing.store.file=${{ github.workspace }}/upload.jks \
            -Pandroid.injected.signing.store.password=${{ secrets.UPLOAD_KEYSTORE_PASSWORD }} \
            -Pandroid.injected.signing.key.alias=${{ secrets.UPLOAD_KEY_ALIAS }} \
            -Pandroid.injected.signing.key.password=${{ secrets.UPLOAD_KEY_PASSWORD }}

      - name: Upload AAB to Play Store internal track
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: org.siros.sdk.sample
          releaseFiles: sample-app/build/outputs/bundle/release/sample-app-release.aab
          tracks: internal
          status: completed
