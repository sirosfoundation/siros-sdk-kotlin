name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write

jobs:
  build:
    name: Build SDK & Sample App
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Configure vendor Maven repository
        run: |
          mkdir -p ~/.gradle
          cat >> gradle.properties <<EOF
          facetecMavenUrl=${{ secrets.FACETEC_MAVEN_URL }}
          facetecMavenToken=${{ secrets.VENDOR_PACKAGES_TOKEN }}
          EOF

      - name: Build SDK AARs
        run: ./gradlew assembleRelease -x test -x lint

      - name: Build sample APK
        run: ./gradlew :sample-app:assembleDebug -x test -x lint

      - name: Collect artifacts
        run: |
          mkdir -p release-artifacts
          # SDK modules
          find sdk -name "*.aar" -path "*/release/*" -exec cp {} release-artifacts/ \;
          # Sample APK
          find sample-app -name "*.apk" -path "*/debug/*" -exec cp {} release-artifacts/ \;
          ls -la release-artifacts/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release-artifacts/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-maven:
    name: Publish to GitHub Packages
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Publish SDK to GitHub Packages
        run: ./gradlew publish -x test -x lint || echo "publish task not configured yet — skipping"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
