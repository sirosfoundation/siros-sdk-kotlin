# Native nymauth provers for the SIROS SDKs (Kotlin first), through UniFFI.
#
# Longfellow: the nym_auth mdoc circuits (the nym-auth-circuits archive's LFC2 pair) on Google's
# longfellow-zk Rust runtime, through community-demo's own nym-longfellow crate: the code its
# verifier runs, so a proof made here is checked by the same implementation that checks it there.
# It is an alternative to zk-cred-longfellow (ISRG's Rust Longfellow) for the SDK's
# `longfellow-nymauth` system; the SDK chooses per system (NymAuthBinding).
#
# nym-longfellow is a git dependency on AltmannPeter/readdit-demo, pinned to commit 50c47ac98e37f6
# (merged to its main: adds Circuits::from_pair and Layout::parse, no behaviour change otherwise).
# That repo's cargo workspace root is native/longfellow/ (not the repo root); Cargo resolves the
# nym-longfellow package from within the cloned tree regardless. Bump the rev when the build changes.
[package]
name = "nymauth-native"
version = "0.1.0"
edition = "2024"
description = "Native nymauth provers for the SIROS SDKs: Longfellow on Google's longfellow-zk Rust runtime"
publish = false

[lib]
name = "nymauth_native"
crate-type = ["lib", "cdylib", "staticlib"]

[[bin]]
# UniFFI's binding generator (Kotlin, Swift), in library mode.
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"
required-features = ["bindgen"]

[features]
default = ["longfellow", "counting-alloc"]
longfellow = ["dep:nym-longfellow"]
# The counting global allocator (community-demo's node/src/alloc.rs), so a proof reports heap_mb and
# witness_mb in community-demo's meaning. Off for a host that brings its own allocator.
counting-alloc = []
bindgen = ["uniffi/cli"]

[dependencies]
nym-longfellow = { git = "https://github.com/AltmannPeter/readdit-demo", rev = "50c47ac98e37f65003a71e75059fd49ce6f91916", optional = true }
uniffi = "0.29"
thiserror = "2"
p256 = { version = "0.13", features = ["ecdsa"] }
sha2 = "0.10"
base64 = "0.22"
hex = "0.4"
zeroize = "1"

[dev-dependencies]
serde_json = "1"
zstd = "0.13"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
