# DEMO ONLY: the BBS demo issuer of the ZKP demo wallet, as its own small library (its own .so and UniFFI
# namespace, `uniffi.nymauth_demo_issuer`), so the SDK's nymauth-native carries no issuer code. The demo
# app issues the adult's bbs_cd credential on the phone, bound to a StrongBox key, under a demo issuer
# whose seed is bundled with the app (community-demo's BBS verifier learns a new issuer key on first use).
# Never a dependency of the SDK.
#
# All readdit-demo crates below are pinned to commit 0250f907ec3264, the same feat/bbs-prove-with-signer
# tip the main crate's Cargo.toml pins (see its header and sirosfoundation/siros-sdk-kotlin#365).
[package]
name = "nymauth-demo-issuer"
version = "0.1.0"
edition = "2024"
description = "DEMO ONLY: issues nym_auth bbs_cd credentials under a seed-derived demo issuer, for the ZKP demo wallet"
publish = false

[lib]
name = "nymauth_demo_issuer"
crate-type = ["lib", "cdylib"]

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"
required-features = ["bindgen"]

[features]
bindgen = ["uniffi/cli"]

[dependencies]
uniffi = "0.29"
thiserror = "2"
p256 = { version = "0.13", features = ["ecdsa"] }
serde_json = "1"
nym-bbs = { git = "https://github.com/AltmannPeter/readdit-demo", rev = "0250f907ec3264cb876da9c909362e553ea77093" }
bbs-cd = { git = "https://github.com/AltmannPeter/readdit-demo", rev = "0250f907ec3264cb876da9c909362e553ea77093" }
bbs-cd-plugin = { git = "https://github.com/AltmannPeter/readdit-demo", rev = "0250f907ec3264cb876da9c909362e553ea77093", features = ["parallel"] }
cd-ecdsa-pop = { git = "https://github.com/AltmannPeter/readdit-demo", rev = "0250f907ec3264cb876da9c909362e553ea77093", features = ["parallel"] }
cd-date-range = { git = "https://github.com/AltmannPeter/readdit-demo", rev = "0250f907ec3264cb876da9c909362e553ea77093" }
cd-pseudonym = { git = "https://github.com/AltmannPeter/readdit-demo", rev = "0250f907ec3264cb876da9c909362e553ea77093" }

[dev-dependencies]
# The end-to-end test proves with the SDK's library and verifies with community-demo's verifier.
nymauth-native = { path = "..", default-features = false, features = ["bbs"] }
rand_core = { version = "0.6", features = ["getrandom"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
