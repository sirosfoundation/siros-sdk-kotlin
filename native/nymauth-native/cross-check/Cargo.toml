# Cross-verification with zk-cred-longfellow (ISRG's Rust Longfellow, the SDK's other implementation of
# `longfellow-nymauth`): a proof from either is accepted by the other's verifier. Not part of the
# library; run with zk-cred-longfellow and readdit-demo checked out next to siros-sdk-kotlin:
#   (cd cross-check && cargo test --release)
[package]
name = "nymauth-native-cross-check"
version = "0.0.0"
edition = "2024"
publish = false

[dependencies]
nymauth-native = { path = "..", default-features = false, features = ["longfellow"] }
zk-cred-longfellow = { path = "../../../../zk-cred-longfellow" }
nym-longfellow = { path = "../../../../readdit-demo/native/longfellow/nym-longfellow" }
p256 = { version = "0.13", features = ["ecdsa"] }
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
serde_json = "1"
zstd = "0.13"

[profile.release]
opt-level = 3

[workspace]
