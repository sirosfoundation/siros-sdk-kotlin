org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
# Dokka 2.x: enable the V2 Gradle plugin so the `dokkaGenerate` task used by CI is available.
org.jetbrains.dokka.experimental.gradle.pluginMode=V2EnabledWithHelpers

# Version of the NEXT SDK release, published as org.siros:siros-sdk-*:<sdkVersion>.
# Bumped by the release PR together with sample-app's versionName; CI overrides
# it from the release tag (see release.yml).
sdkVersion=0.23.2

# The wallet-core engine pin (v0.23.2: 0.2.10 — carries #13
# fix-oid4vp-consent-claims-path, the jarm 400-body diagnostic, and the
# state main reached over the 14-PR stack; the stale 0..9 pin is what
# 400'd the on-device JARM submission on 2026-11-15).
walletCoreVersion=0.2.10
