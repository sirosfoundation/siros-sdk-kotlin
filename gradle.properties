org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
# Dokka 2.x: enable the V2 Gradle plugin so the `dokkaGenerate` task used by CI is available.
org.jetbrains.dokka.experimental.gradle.pluginMode=V2EnabledWithHelpers

# Version of the NEXT SDK release, published as org.siros:siros-sdk-*:<sdkVersion>.
# Bumped by the release PR together with sample-app's versionName; CI overrides
# it from the release tag (see release.yml).
sdkVersion=0.23.7

# The wallet-core engine pin (v0.23.2: 0.2.10 — carries #13
# fix-oid4vp-consent-claims-path, the jarm 400-body diagnostic, and the
# state main reached over the 14-PR stack; the stale 0..9 pin is what
# 400'd the on-device JARM submission on 2026-11-15).
# 2026-11-16: 0.2.10 -> 0.2.15 — the frontend-shaped DID resolve (the
# wallet-backend AuthZEN proxy 403'd the engine's bespoke
# resource_type: did_document; the frontend's own shape - no
# resource_type, the proxy defaults it - works) and the jarm 400-body
# diagnostic. The URN-spelling vct shim that briefly rode 0.2.13/0.2.14
# is REVERTED (cbe5654): vct is a case-sensitive identifier
# (SD-JWT VC 2.2.2.1), the issuer-side fix is Spherity's to make, and
# the wallet will not paper over it. Central publishes after the
# 2026-12-01 quota reset; GH Packages and the release assets carry it.
# 2026-11-16b: 0.2.15 -> 0.2.16 — the #11 merge sweep regression fixed
# (9596d5c): the code-for-token POST lost its client_id form member
# (apigw refuses the authorization_code grant without it), found via the
# wallet-frontend wasm integration. The regression test now asserts the
# form carries client_id so the next test-relocating merge cannot land
# silently (backlog E).
# 2026-11-16c: 0.2.16 -> 0.2.17 — the second #11 sweep regression fixed
# (6346016): CredentialResponse lost its credentials[] batch member and
# the fallback reading credentials[0] into credential (SUNET's GDC apigw
# answers single-credential requests with the batch shape), so issuance
# answered "the issuer returned no credential" while the credential sat
# in credentials[0]. Regression test pins the batch decode.
# 2026-11-17: 0.2.17 -> 0.2.20 — the OID4VCI proof fix (7ef64ae: every
# proof 401'd invalid_proof "JWT signature validation failed" — the
# embedded AAR carried it since the engine regression) and the #45
# realeyes ZkpPresenter surface reach the embedded engine; the npm
# package @sirosfoundation/siros-wallet-core republished at the same
# version. The MatchParams FFI record gained clientMetadata (the
# verifier's vp_formats_supported and the consent's client_name/
# logo_uri) — the vendored bindings regenerated from the v0.2.20
# release's bindings.zip.
# 2026-11-18: 0.2.22 -> 0.2.24 (wallet-core v0.2.24, tag 296bee7): #55 —
# the encrypted batch fill with the §7.1 plain-secret gate scoped to
# plain answers (the realeyes demo's 604-char-completion "no credential"
# repro's fix); #56 — SignParams/SigningKeyParams gained
# credentialConfigurationId (go-wallet-backend#558's twin: every
# configuration's ask names its id so the client pairs each key with the
# completion entry carrying the same). The vendored bindings regenerated
# from the v0.2.24 release's bindings.zip.
walletCoreVersion=0.2.24
